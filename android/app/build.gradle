plugins { id 'com.android.application' }

android {
    namespace 'com.nexus.cyberforge'
    compileSdk 36

    defaultConfig {
        applicationId 'com.nexus.cyberforge'
        minSdk 34
        targetSdk 36
        versionCode 92
        versionName '0.92.0-beta-insider-mobile'
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
