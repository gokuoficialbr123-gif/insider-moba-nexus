name: Build NEXUS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceitar licenças do Android SDK
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Instalar Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Sincronizar site nos apps
        run: python3 tools/sync_web.py

      - name: Preparar Gradle
        run: chmod +x android/gradlew

      - name: Gerar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-BETA-INSIDER-ANDROID
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
